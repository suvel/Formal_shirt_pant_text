<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shirt Texture Mockup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Shirt Texture Mockup</h1>
    <p class="instructions">Upload a texture or pattern image and it will be applied to the shirt, keeping the fabric's natural folds and shading.</p>

    <div class="controls">
      <label for="texture-input">Texture image</label>
      <input type="file" id="texture-input" accept="image/*">
    </div>

    <p id="error-message" role="alert" hidden></p>

    <div class="canvas-wrap">
      <canvas id="preview-canvas" width="480" height="520">
        Your browser does not support the canvas element.
      </canvas>
    </div>

    <button id="download-btn" disabled>Download PNG</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
